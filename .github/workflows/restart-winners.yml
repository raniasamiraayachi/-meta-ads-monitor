name: Meta Ads Winner Restart (00:00 Algérie)

on:
  schedule:
    - cron: '7 23 * * *' # 00:00 heure Algérie = 23:00 UTC (Algérie n'a pas d'heure d'été)
  workflow_dispatch: {} # pour tester manuellement

permissions:
  contents: write # needed so the workflow can commit state.json back

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restart winning ads
        run: node restart-winners.js
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "ads-monitor-bot"
            git config user.email "actions@github.com"
            git add state.json
            git pull --rebase origin main || true
            git commit -m "chore: restart winners, update state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
